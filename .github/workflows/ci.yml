name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Tests
        run: npm test

  dogfood:
    name: This repository's own AGENTS.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the published action against this repository
        uses: ./
        with:
          strict: "true"
